name: acceptance

# T-145 · 验收执行器的触发点
#
# 存在的理由：`tools/verify_acceptance_run.py` 是全部验收判据的唯一执行入口，
# 而在本文件出现之前，**没有任何东西会自动跑它**。
# 判据再多，没人跑就等于没有（AGENTS.md §2.4.2「判据与触发者两层」）。
#
# ── 为什么不是「跑一遍，绿了就算过」──
#
# 执行器今天退 **2**（untested=20，其中 7 条 manual 永远不会转 passed）。
# 所以这里不能断言「untested == 0」—— 那会**永远红**，而红了三个月之后
# 所有人都会开始无视这条 CI（§2.1.1「一个会误报的检查器比没有更糟」）。
#
# 判据用**棘轮**（`tools/verify_acceptance_ratchet.py`）：
#   · failed 必须为 0
#   · 计数之和必须等于 136（防「删了几行所以看起来没倒退」）
#   · passed 不得低于 `tools/acceptance-ratchet.json` 里的地板
# 地板只许上调；下调是一次有记录的决定。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上后来的推送取消先前那次 —— 验收全量是分钟级，不取消会排队堆起来。
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 第一层：结构检查（秒级，先跑，快速失败）────────────────────────────
  # 这一层不装依赖、不起服务，只查「配置与登记表对不对」。
  # 它先跑的原因：后面两层每个都要几分钟，而这层红了通常意味着后面必然红。
  static:
    name: 静态与登记表
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: "0.13.1"

      # ★ `--locked`：不许无锁安装（G-02）。这条在 verify_dependency_lock.py 的 L6 里也断言，
      #   但那里查的是「Dockerfile 有没有带 --locked」，**管不到本文件**。
      #   所以本文件必须自己带 —— 两处各写一遍不算重复，是两个不同的执行点。
      - name: 建 .venv（映射里 {venv} 指向它，105 处）
        run: uv sync --locked

      - name: 验证器名册双向完整
        run: .venv/bin/python tools/verify_coverage.py --controls

      - name: 无填充文件（read 工具打不开的那种）
        run: .venv/bin/python tools/verify_depad.py

      - name: 仓内文本无凭据形态
        run: .venv/bin/python tools/verify_secret_patterns.py

      - name: 依赖锁与 pyproject 一致
        run: .venv/bin/python tools/verify_dependency_lock.py

      # ★ 触发点自检：**只判 CI 这一条通道**（`--scope ci`）。
      #
      #   为什么不是三通道全读：hook 通道在 fresh clone 里永远是「未安装」，
      #   远端分支保护永远读不到 —— 三通道全读时本脚本在 CI 里**必然退 2**，
      #   而 CI 步骤退 2 就是失败，于是这条 job 会**永远红**。
      #   那正是本票开头批评的东西（「永远红的 CI 会被无视」），
      #   只不过会犯在触发点自己的自检上。
      #
      #   别写 `|| true`（假绿，等于没装），也别把 hook/远端降成永不判红
      #   （那本地就失去这两条读数）。**换判据，不是放宽判据。**
      - name: 触发点自检（只判 CI 通道）
        run: .venv/bin/python tools/verify_acceptance_trigger.py --scope ci

      # ★ waiver 台账：**结构阻断，到期告警**（T-230 收口，2026-10-23）
      #
      #   为什么不是直接 `verify_waivers.py`：
      #     那条路径下，**任何一条 waiver 到期 = 本 job 退 1 = CI 永久红**。
      #     而到期是**日历事件**，不是代码回归 —— 一条到期就红会持续到有人改期，
      #     于是「红了三个月之后所有人都会无视这条 CI」（§2.1.1 那个已知失败模式）。
      #
      #   所以用 `--expiry-warn-only`：**换判据，不是放宽判据**。
      #     · 结构性错误（字段缺失 / owner 未定 / 日期解析不出 / 出处对不上）
      #       → **仍然退 1，阻断**。这些是真缺陷，必须当场修。
      #     · 到期（W7）→ **退 0，但大声打出清单**，处置由 owner 做一次书面决定
      #       （续期要写新理由与新日期，或转 closed/revoked）。
      #
      #   ★ 别把它改回 `verify_waivers.py`：那样会让「日历到期」与「代码坏了」
      #     共用同一个红，而两者的下一步动作完全不同。
      #   ★ 也别因为它退 0 就把这条 job 当成「waiver 没问题」——
      #     它证明的是「台账结构完整、读数算得出」，**不证明没有到期项**。
      #     到期清单在 job 日志里，CI 绿不代表它为空。
      - name: waiver 台账（结构阻断，到期告警）
        run: .venv/bin/python tools/verify_waivers.py --expiry-warn-only

  # ── 第二层：验收执行门（分钟级）──────────────────────────────────────────
  acceptance:
    name: 验收棘轮
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: 安装 uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: "0.13.1"

      # ★ 必须建在**仓库根**的 `.venv`：verifier_map 里 {venv} 出现 105 次，
      #   `_render()` 把它拼成 `<root>/.venv/bin/python`。
      #   uv 默认就建在这里，但显式写出来是为了让「为什么必须是这个路径」留在文件里。
      - name: 建 .venv（uv 默认建在仓库根，与 {venv} 一致）
        run: uv sync --locked

      - name: 前端依赖
        working-directory: web
        run: npm ci

      - name: 前端构建（#113/#116 的产物依赖它）
        working-directory: web
        run: npm run build

      # Chrome：a11y_check.mjs 支持 CHROME_BIN，但 runner 的默认值写的是 macOS 路径。
      # 不设这个环境变量，#116/#113 会以 rc=2（未测）退出 —— 那是**准确的红**，
      # 但在 CI 上它意味着「这台机器上从没验过」，与「验了没通过」是两件事。
      - name: 装 Chrome（#113 / #116 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || {
            echo "::warning::Chrome 装不上 —— #113/#116 会落未测（rc=2），不会假装通过"
            exit 0
          }
          echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"

      # ★ 先把执行器跑一遍拿到读数，再喂给棘轮。
      #   两步分开而不是一条管道：管道会吃掉退出码（`$?` 取的是最后一个命令），
      #   而「执行器退 2」与「棘轮判红」是两件需要分开看的事。
      - name: 跑验收执行器（它退 2 是正常的 —— 未测不等于红）
        run: |
          set +e
          .venv/bin/python tools/verify_acceptance_run.py > acceptance-run.txt 2>&1
          echo "executor_rc=$?" >> "$GITHUB_ENV"
          tail -40 acceptance-run.txt
          exit 0

      - name: 棘轮判据
        run: |
          cat acceptance-run.txt | .venv/bin/python tools/verify_acceptance_ratchet.py

      - name: 上传执行器全量输出
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: acceptance-run
          path: acceptance-run.txt
          retention-days: 14

  # ── 第三层：规则变更门（T-411 / GA-08）────────────────────────────────
  #
  # 为什么是**独立 job + paths 过滤**，而不是并进上面两个 job：
  #   上面两个 job 每次推送都跑；而「改了规则就必须跑冻结回归集」这件事
  #   只在**规则文件真的变了**时才有意义。并进去的代价是每次推送都多跑一遍
  #   83 条样本的引擎响应（分钟级），而人会开始嫌慢、然后去关它。
  #
  # ★ `paths` 必须**逐个点名**规则文件，不能写 `research/**`：
  #   写宽了等于「几乎每次推送都跑」，写窄了（少一个文件）等于「改了规则
  #   却不跑」—— 后者更坏，因为它**不会红**。
  #   这条形状由 `tools/verify_rule_change_gate.py` 的 G2 断言（集合恒等）。
  #
  # ★ 不许写 `continue-on-error: true` 或 `|| true`：
  #   「回归集没跑成」必须让这条 job **红**。写成软失败，就等于
  #   「门在那儿，但谁都能走过去」—— 那比没有门更糟，因为它看起来有门。
  #   由 G4 断言（只扫代码行，不扫注释）。
  #
  # ★ 这里**不**声明 `needs: static`：规则变更门与静态检查彼此独立，
  #   挂上依赖会让「静态检查偶发红」连带把规则门也跳过。
  rule-change-gate:
    name: 规则变更门
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch'
    # ★ 逐个点名，不用通配。见上面那段注释与 verify_rule_change_gate.py 的 G2。
    paths:
      - research/governance/skeleton/rules-v1.json
      - research/governance/skeleton/engine-manifest.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # 需要基线才能出「before/after」两份读数（行 87 的原话：
          # 只出单点数值即红）。
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: "0.13.1"

      - name: 建 .venv（与其它 job 同一个路径，映射里的 {venv} 依赖它）
        run: uv sync --locked

      - name: 门自身接线自检
        run: .venv/bin/python tools/verify_rule_change_gate.py

      - name: 冻结回归集结构（规模/覆盖/指纹/变更记录）
        run: .venv/bin/python tools/verify_regression_set.py

      - name: 规则变更 → 回归集前后对比（真跑一次变更）
        run: .venv/bin/python tools/verify_rule_change_regression.py
