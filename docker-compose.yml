# ─────────────────────────────────────────────────────────────────────────────
# 内容审核工作台 · 生产 compose（独立项目，不碰服务器上其他容器）
#
# 隔离手段（对应委托方的「不要干扰其他 docker 应用」）：
#   - 独立 project name：`momcozy-audit`（`COMPOSE_PROJECT_NAME` 由文件名前缀保证）
#   - 独立网络：`momcozy-audit-net`，不与 bridge / bos_web_net / lighthouse_ai_video_net 共用
#   - **只绑 127.0.0.1**：对外由宿主机现有的 ai_video_nginx 反代，不抢 80/443
#   - 不用 `latest`，镜像打 commit tag
# ─────────────────────────────────────────────────────────────────────────────

name: momcozy-audit

services:
  api:
    image: ${AUDIT_IMAGE:-momcozy-audit:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momcozy-audit-api
    restart: unless-stopped

    # ★ 绑到宿主机 docker 网桥地址，不是 0.0.0.0，也不是 127.0.0.1。
    #
    # 为什么不绑 0.0.0.0：会暴露到公网，且与宿主机共享反代抢 80/443 的语义混在一起。
    #
    # 为什么不绑 127.0.0.1：反向代理跑在容器里（`ai_video_nginx`，网络
    # `lighthouse_ai_video_net`，网关 `172.20.0.1`）。**容器里的 127.0.0.1 是它自己**，
    # 不是宿主机 —— 绑 loopback 会让反代 proxy_pass 到 `172.20.0.1:18000` 时连不上。
    # 本项目现有服务全部绑 `172.20.0.1:<port>`，照同一形状。
    #
    # 暴露面：只有本机 docker 网桥可达；公网仍需经过反代（443）。
    ports:
      - "172.20.0.1:18000:8000"

    # ★ 凭据从**仓库外**的绝对路径读，不进 git 工作区。
    #
    # 最初写的是相对路径 `.env.production`，部署时得把 /opt/.../.env.production
    # 复制进 repo/ 才能跑 —— 那让凭据落进了 git 工作区（虽然被 .gitignore 挡住，
    # 但「靠 ignore 保护」不是保护）。改成绝对路径后，repo/ 里一个凭据文件都没有。
    env_file:
      - /opt/momcozy-audit-platform/.env.production

    volumes:
      # 可写数据（authority / projection / session / principals / 日志）。
      # 宿主机目录，便于备份与人工检查；容器重建不丢数据。
      - /opt/momcozy-audit-platform/data/authority:/data/authority
      - /opt/momcozy-audit-platform/data/projection:/data/projection
      - /opt/momcozy-audit-platform/data/logs:/data/logs
      # principals.json **只读挂载**：这是权限源，容器不该改它
      - /opt/momcozy-audit-platform/config/principals.json:/data/principals.json:ro
      # SQLite 落在 data 下，与上面三个目录不重叠（ProductionSettings 会校验这一点）
      - /opt/momcozy-audit-platform/data/db:/data/db
      # ★ 报告正文 + index.jsonl 必须有自己的 bind mount（2026-10-26 实测缺陷）。
      #
      #   不加这一行时：`/data` 是 Dockerfile 末尾的 VOLUME（**匿名卷**），
      #   而 `reports-root` 落在它里面。于是 `docker compose down && up` 之后
      #   匿名卷被换成新的一个 —— 症状是
      #       GET /api/v1/reports      → 200，列表里有那条 report_id
      #       GET /static/reports/….md → 404，正文没了
      #       GET /readyz              → 200，七项全 true
      #   也就是说「列表有、点开 404」，且**没有任何检查会红**。
      #
      #   ★ 为什么单独的 readyz 检查盖不住：`data_permissions` 只遍历
      #     authority / projection / logs / principals 四项，**不含 report_root**
      #     （api/production_app.py 的 _ensure_private_dir 循环）。
      #     所以这不是「少配了一个目录」，是「配了但没人在查」。
      - /opt/momcozy-audit-platform/data/reports-root:/data/reports-root
      # ★ 2026-10-30：媒体素材根。图片/视频进件的路径校验基准。
      #   不加这一行时 REVIEW_MEDIA_ROOTS=/data/media 在容器里**不存在**，
      #   ProductionSettings 构造期就抛 media_roots[0]_not_a_directory ——
      #   容器起不来，整站 502。实测就是这个形状。
      #
      # ★★ 这一行原先**只在服务器上**、从未进过版本库。于是 2026-10-30
      #   部署时一句 `git reset --hard origin/main` 就把它冲掉了，而
      #   当时运行中的容器还带着老挂载，所以**看起来没坏** ——
      #   下一次重建才会 502。这正是「部署脚本会抹掉手改」的形状：
      #   手改的东西没有归属，而 reset 不知道它属于谁。
      - /opt/momcozy-audit-platform/data/media:/data/media

    networks:
      - momcozy-audit-net

    # 容器内单进程：不写 --workers（Dockerfile CMD 已经保证）。
    # 这里不设 cpus/memory 硬上限 —— 试点期先观察，避免因内存不足被 OOM 杀掉
    # 而看起来像「服务自己挂了」。
    stop_grace_period: 30s

    healthcheck:
      # /healthz 是固定低敏端点（不碰 authority / 不查库），
      # /readyz 才是真探。健康检查用 /healthz，避免把依赖抖动算成容器不健康。
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  momcozy-audit-net:
    name: momcozy-audit-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
